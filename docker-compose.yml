name: url-shortener

services:
  redis:
    image: redis:7
    # appendonly/everysec: a Redis crash loses at most ~1s of un-flushed clicks.
    # volatile-lru: under memory pressure only keys WITH a TTL (cache entries) are evicted, never the
    # TTL-less pending click hashes. See docs/decisions/05-click-counting.md.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DB_PRIMARY_URL: jdbc:postgresql://db:5432/urlshortener
      # Same database locally; point this at a real read replica in production.
      DB_REPLICA_URL: jdbc:postgresql://db:5432/urlshortener
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      BASE_URL: http://localhost:${APP_PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl; bash's /dev/tcp is enough to speak HTTP/1.0 to /health.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"ok\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
  redis-data:
