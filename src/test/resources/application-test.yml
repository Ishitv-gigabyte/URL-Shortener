# Small pools: several Spring test contexts may be alive at once (each with its own pools), and the
# Postgres container allows 100 connections. Production sizes would exhaust it.
app:
  clicks:
    # Tests trigger flushes explicitly (ClickFlushJob.flushOnce) so they are deterministic.
    scheduling-enabled: false
  datasource:
    primary:
      maximum-pool-size: 5
      minimum-idle: 1
    replica:
      # Same database as the primary unless a test registers a separate replica (SeparateReplica).
      jdbc-url: ${app.datasource.primary.jdbc-url}
      username: ${app.datasource.primary.username}
      password: ${app.datasource.primary.password}
      maximum-pool-size: 5
      minimum-idle: 1
    flush:
      maximum-pool-size: 2
      minimum-idle: 1
