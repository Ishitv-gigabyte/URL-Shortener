# Small pools: several Spring test contexts may be alive at once (each with its own pools), and the
# Postgres container allows 100 connections. Production sizes would exhaust it.
app:
  clicks:
    # Tests trigger flushes explicitly (ClickFlushJob.flushOnce) so they are deterministic.
    scheduling-enabled: false
  datasource:
    primary:
      maximum-pool-size: 5
      minimum-idle: 1
    replica:
      maximum-pool-size: 5
      minimum-idle: 1
    flush:
      maximum-pool-size: 2
      minimum-idle: 1
